repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^helm/templates/
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^screenlog\.0$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(\.secrets\.baseline|screenlog\.0|uv\.lock|frontend/package-lock\.json)$

  - repo: local
    hooks:
      - id: publication-check
        name: Public source boundaries
        entry: make publication-check
        language: system
        pass_filenames: false
        always_run: true
      - id: helm-check
        name: Helm render and deployment contracts
        entry: make helm-check
        language: system
        pass_filenames: false
        files: ^(helm/|tests/deployment/|\.pre-commit-config\.yaml$)
      - id: make-format-check
        name: make format-check
        entry: make format-check
        language: system
        pass_filenames: false
        always_run: true
      - id: make-mypy
        name: make mypy
        entry: make mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml)
      - id: make-frontend-lint
        name: make frontend-lint
        entry: make frontend-lint
        language: system
        pass_filenames: false
        files: ^frontend/
