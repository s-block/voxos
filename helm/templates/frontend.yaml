{{- if and (eq .Values.mode "application") .Values.components.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voxos.name" . }}-frontend
  labels:
    {{- include "voxos.labels" . | nindent 4 }}
data:
  default.conf: |
    map $http_upgrade $voxos_connection_upgrade {
      default upgrade;
      '' close;
    }
    map $http_x_forwarded_proto $voxos_forwarded_proto {
      default $scheme;
      https https;
      http http;
    }
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      {{- include "voxos.frontendSecurityHeaders" . | nindent 6 }}
      location = /frontend-health { access_log off; return 200 "ok\n"; }
      location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        {{- include "voxos.frontendSecurityHeaders" . | nindent 8 }}
        {{- if .Values.frontend.publicConfigSecret }}
        alias /var/run/voxos-public/runtime-config.js;
        {{- else }}
        try_files $uri =404;
        {{- end }}
      }
      location /api/ {
        proxy_pass http://{{ include "voxos.name" . }}-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voxos_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $voxos_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 100m;
      }
      {{- if .Values.frontend.firebaseAuthHost }}
      location /__/auth/ {
        proxy_pass https://{{ .Values.frontend.firebaseAuthHost }};
        proxy_set_header Host {{ .Values.frontend.firebaseAuthHost }};
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      }
      {{- end }}
      location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        {{- include "voxos.frontendSecurityHeaders" . | nindent 8 }}
      }
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        {{- include "voxos.frontendSecurityHeaders" . | nindent 8 }}
      }
    }
{{- end }}
