src = ["src"]
line-length = 120  # Same as Black.
target-version = "py312"

[lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"  # Allow unused variables when underscore-prefixed.
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C9",
    "COM",
    # "D", # Ignore doc errors if needed
    "DJ",
    "E",
    "EM",
    "ERA",
    "F",
    "FBT",
    "G",
    "I",
    "INP",
    "ISC",
    "N",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "Q",
    "RET",
    "RSE",
    "S",
    "SIM",
    "T",
    "TID",
    "TRY",
    "W",
    "YTT"
]

ignore = [
    "COM812",  # Wants trailing commas in function calls, leave this to black.
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "D203",	 # 1 blank line required before class docstring, use D211 No blank lines allowed
    "D213",  # Multi-line docstring summary should start at the second line Incompatible with D212 Multi-line docstring summary should start at the first line
    "D401",  # First line of docstring should be in imperative mood: "This is responsible for generating pact file"
    "PLC1901",  # Does not take into account None/0 values so incorrect: https://github.com/astral-sh/ruff/issues/4282
    "PTH",  # flake8-use-pathlib - no need to enforce this
    "S101",  # Flags up assert in tests.
    "D212",  # Multi-line docstring summary should start at the first line
    "D200",  # One-line docstring should fit on one line with quotes
    "FBT002",
    "FBT001",
    "B008",
    # Ignore less critical errors to focus on important ones
    "BLE001",  # Blind exception catching is often intentional for resilience
    "TRY300",  # Move to else block - stylistic preference
    "TRY301",  # Abstract raise to inner function - stylistic preference
    "TRY002",  # Create custom exception - would require significant refactoring
    "B904",    # Exception chaining - would require extensive refactoring
    "C901",    # Function complexity - would require breaking up functions
    "ARG001",  # Unused function argument - often kept for interface compatibility
    "ARG002",  # Unused method argument - often kept for interface compatibility
    "ARG003",  # Unused class method argument - often kept for interface compatibility
    "ARG004",  # Unused static method argument - often kept for interface compatibility
    "PLW2901", # Loop variable overwritten - sometimes intentional
    "SIM105",  # Use contextlib.suppress - stylistic preference
    "SIM108",  # Use ternary operator - stylistic preference
    "SIM117",  # Use single with statement - stylistic preference
    "ISC001",  # Implicitly concatenated strings - sometimes intentional
    "A001",    # Variable shadowing builtin - sometimes unavoidable
    "A002",    # Argument shadowing builtin - sometimes unavoidable
    "TRY401",  # Redundant exception in logging - sometimes intentional
    "TRY004",  # Prefer TypeError - stylistic preference
    "SIM102",  # Use single if statement - stylistic preference
    "S105",    # Hardcoded password - false positives
    "S608",    # SQL injection - false positives in safe contexts
    "G004",    # f-string in logging - acceptable for performance
    "S104",    # Binding to all interfaces - intentional for web services
    "PLW0603", # Using global statement - acceptable for singleton patterns
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "slack_service_desk",
    "venv",
]

[lint.per-file-ignores]
"alembic/env.py" = ["INP001"]  # This is an Alembic script; making it a package would shadow the dependency.
"**/tests/**/*.py" = ["ARG001","ARG002","INP001", "E402", "PLC0415"]  # PLC0415: Allow imports inside functions in tests
"**/tests/e2e/**/*.py" = ["ARG001","ARG002","INP001", "E402", "PLC0415", "T201", "TRY003", "EM101", "E501"]  # E2E tests: Allow print, long lines, etc.
"**/migrations/versions/*.py" = ["ALL"]
"**/migrations/env.py" = ["F403", "F405"]  # Allow star imports in migrations
"**/tests/scripts/**/*.py" = ["ALL"]

[lint.mccabe]
max-complexity = 10  # Unlike Flake8, default to a complexity level of 10.

[lint.isort]
known-third-party = []

#[lint.pydocstyle]
#convention = "google"
